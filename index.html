<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Gentlemen's Dispute - Web</title>
<style>
  body { margin: 0; padding: 0; background: #222; overflow: hidden; touch-action: none; font-family: sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; background: #87CEEB; }
  #ui { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; color: white; font-weight: bold; font-size: 22px; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 5; }
  .controls { position: absolute; bottom: 20px; display: flex; gap: 8px; z-index: 5; }
  #p1-controls { left: 10px; }
  #p2-controls { right: 10px; }
  button { width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid white; color: white; font-size: 20px; font-weight: bold; touch-action: manipulation; user-select: none; -webkit-user-select: none; display: flex; align-items: center; justify-content: center; }
  button:active { background: rgba(255,255,255,0.7); }
  .jump-btn { background: rgba(0,255,0,0.4); }
  .attack-btn { background: rgba(255,0,0,0.5); }
  #win-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; font-size: 32px; z-index: 10; text-align: center; }
  #win-screen button { border-radius: 10px; width: 160px; height: 60px; font-size: 20px; margin-top: 20px; background: #4CAF50; border: none; color: white; display: block; }
</style>
</head>
<body>

<div id="ui">
  <div id="p1-score">P1: 0</div>
  <div id="p2-score">P2: 0</div>
</div>

<canvas id="gameCanvas"></canvas>

<!-- دکمه‌های بازیکن آبی (چپ) -->
<div class="controls" id="p1-controls">
  <button id="p1-left">◀</button>
  <button id="p1-right">▶</button>
  <button id="p1-jump" class="jump-btn">▲</button>
  <button id="p1-attack" class="attack-btn">✊</button>
</div>

<!-- دکمه‌های بازیکن قرمز (راست) -->
<div class="controls" id="p2-controls">
  <button id="p2-left">◀</button>
  <button id="p2-right">▶</button>
  <button id="p2-jump" class="jump-btn">▲</button>
  <button id="p2-attack" class="attack-btn">✊</button>
</div>

<div id="win-screen">
  <div id="win-text">Player 1 Wins!</div>
  <button onclick="resetGame()">بازی مجدد</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if(player1 && player2) {
    player1.y = H - 100;
    player2.y = H - 100;
  }
}
window.addEventListener('resize', resize);
resize();

const GRAVITY = 0.6;
const MOVE_SPEED = 5;
const JUMP_POWER = -13;
const ATTACK_RANGE = 60;
const ATTACK_COOLDOWN = 25;

class Player {
  constructor(x, color, isP1) {
    this.x = x;
    this.y = H - 100;
    this.vx = 0;
    this.vy = 0;
    this.w = 40;
    this.h = 80;
    this.color = color;
    this.isP1 = isP1;
    this.facing = isP1 ? 1 : -1;
    this.hasHat = true;
    this.attackTimer = 0;
    this.isAttacking = false;
    this.stunTimer = 0;
    this.score = 0;
  }

  update(controls) {
    if (this.stunTimer > 0) {
      this.stunTimer--;
      this.vx *= 0.9;
    } else {
      if (controls.left) { this.vx = -MOVE_SPEED; this.facing = -1; }
      else if (controls.right) { this.vx = MOVE_SPEED; this.facing = 1; }
      else { this.vx *= 0.8; }

      if (controls.jump && this.y >= H - this.h - 1) { this.vy = JUMP_POWER; }
      
      if (controls.attack && this.attackTimer === 0) {
        this.attackTimer = ATTACK_COOLDOWN;
        this.isAttacking = true;
        setTimeout(() => this.isAttacking = false, 150);
      }
    }

    if (this.attackTimer > 0) this.attackTimer--;

    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;

    if (this.y > H - this.h) {
      this.y = H - this.h;
      this.vy = 0;
    }

    if (this.x < 0) this.x = 0;
    if (this.x + this.w > W) this.x = W - this.w;
  }

  draw() {
    ctx.save();
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    
    ctx.fillStyle = 'white';
    if (this.facing === 1) {
      ctx.fillRect(this.x + 25, this.y + 20, 10, 10);
    } else {
      ctx.fillRect(this.x + 5, this.y + 20, 10, 10);
    }

    if (this.hasHat) {
      ctx.fillStyle = 'black';
      ctx.fillRect(this.x - 10, this.y - 15, this.w + 20, 15); 
      ctx.fillRect(this.x + 5, this.y - 40, this.w - 10, 25); 
    }

    if (this.isAttacking) {
      ctx.fillStyle = 'rgba(255, 255, 0, 0.6)';
      let hx = this.facing === 1 ? this.x + this.w : this.x - ATTACK_RANGE;
      ctx.fillRect(hx, this.y + 20, ATTACK_RANGE, 30);
    }
    ctx.restore();
  }
}

class Hat {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 10;
    this.vy = -10;
    this.w = 40;
    this.h = 20;
    this.active = true;
  }
  update() {
    if (!this.active) return;
    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;
    if (this.y > H - this.h) {
      this.y = H - this.h;
      this.vy *= -0.5;
      this.vx *= 0.8;
    }
  }
  draw() {
    if (!this.active) return;
    ctx.fillStyle = 'black';
    ctx.fillRect(this.x, this.y, this.w, this.h);
  }
}

let player1 = new Player(50, '#3498db', true);
let player2 = new Player(W - 90, '#e74c3c', false);
let hats = [];
let gameOver = false;

const keys = {
  p1: { left: false, right: false, jump: false, attack: false },
  p2: { left: false, right: false, jump: false, attack: false }
};

function bindButton(id, player, action) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[player][action] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[player][action] = false; });
  btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[player][action] = true; });
  btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[player][action] = false; });
  btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[player][action] = false; });
}

bindButton('p1-left', 'p1', 'left'); bindButton('p1-right', 'p1', 'right');
bindButton('p1-jump', 'p1', 'jump'); bindButton('p1-attack', 'p1', 'attack');
bindButton('p2-left', 'p2', 'left'); bindButton('p2-right', 'p2', 'right');
bindButton('p2-jump', 'p2', 'jump'); bindButton('p2-attack', 'p2', 'attack');

function checkHit(attacker, defender) {
  if (!attacker.isAttacking || attacker.stunTimer > 0) return;
  let hx = attacker.facing === 1 ? attacker.x + attacker.w : attacker.x - ATTACK_RANGE;
  let hy = attacker.y + 20;

  if (hx < defender.x + defender.w && hx + ATTACK_RANGE > defender.x &&
      hy < defender.y + defender.h && hy + 30 > defender.y) {
    attacker.isAttacking = false;
    defender.stunTimer = 30;
    defender.vx = attacker.facing * 15;
    defender.vy = -6;
    if (defender.hasHat) {
      defender.hasHat = false;
      hats.push(new Hat(defender.x, defender.y - 30));
    }
  }
}

function checkHatPickup(player) {
  for (let i = hats.length - 1; i >= 0; i--) {
    let hat = hats[i];
    if (hat.active && player.x < hat.x + hat.w && player.x + player.w > hat.x &&
        player.y < hat.y + hat.h && player.y + player.h > hat.y) {
      player.hasHat = true;
      hat.active = false;
      hats.splice(i, 1);
      player.score++;
      document.getElementById('p1-score').innerText = `P1: ${player1.score}`;
      document.getElementById('p2-score').innerText = `P2: ${player2.score}`;
      if (player.score >= 3) endGame(player);
    }
  }
}

function endGame(winner) {
  gameOver = true;
  document.getElementById('win-text').innerText = winner.isP1 ? 'Player 1 Wins! 🏆' : 'Player 2 Wins! 🏆';
  document.getElementById('win-screen').style.display = 'flex';
}

function resetGame() {
  player1 = new Player(50, '#3498db', true);
  player2 = new Player(W - 90, '#e74c3c', false);
  document.getElementById('p1-score').innerText = `P1: 0`;
  document.getElementById('p2-score').innerText = `P2: 0`;
  hats = [];
  gameOver = false;
  document.getElementById('win-screen').style.display = 'none';
  gameLoop();
}

function gameLoop() {
  if (gameOver) return;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#654321';
  ctx.fillRect(0, H - 20, W, 20);

  player1.update(keys.p1);
  player2.update(keys.p2);

  checkHit(player1, player2);
  checkHit(player2, player1);

  checkHatPickup(player1);
  checkHatPickup(player2);

  player1.draw();
  player2.draw();
  hats.forEach(hat => { hat.update(); hat.draw(); });

  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
